<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivSpace</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1 class="brand">PRIVSPACE</h1>
            <div class="nav-links">
                <a href="#" class="nav-link active" data-type="movie">Movies</a>
                <a href="#" class="nav-link" data-type="tv">TV Shows</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" id="search" placeholder="Search titles...">
            </div>
        </div>
    </nav>

    <main class="content">
        <div id="grid" class="movie-grid"></div>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-container">
            <button class="modal-close">&times;</button>
            
            <div class="modal-header">
                <img id="m-backdrop" src="" alt="" class="backdrop-img">
                <div class="modal-overlay"></div>
            </div>
            
            <div class="modal-body">
                <div class="modal-info">
                    <div class="poster-container">
                        <img id="m-poster" src="" alt="" class="poster-img">
                    </div>
                    <div class="details">
                        <h2 id="m-title" class="title"></h2>
                        <p id="m-plot" class="plot"></p>
                        
                        <div id="episode-selector" class="hidden">
                            <h3 class="section-title">Episodes</h3>
                            <div id="season-tabs" class="season-tabs"></div>
                            <div id="episode-list" class="episode-list"></div>
                        </div>
                        
                        <div class="player-section">
                            <div id="player-container" class="player-container">
                                <div id="output"></div>
                                <div id="loading" class="loading hidden">
                                    <div class="spinner"></div>
                                    <p>Buffering stream...</p>
                                </div>
                            </div>
                            <div id="source-list" class="source-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
